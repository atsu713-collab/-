<link rel="stylesheet" href="_base.css">
<style>
.wrap{height:880px}
.cols{display:flex;gap:44px;margin-top:16px}
.card{flex:1;background:#fff;border-radius:26px;padding:44px 40px;box-shadow:0 6px 24px rgba(160,130,105,.13)}
.card h3{font-size:32px;margin-bottom:26px;color:#3E3A36}
.badge{display:inline-block;font-size:22px;padding:8px 20px;border-radius:999px;margin-bottom:22px}
.b1{background:#F3DCD2;color:#A85F3C}
.b2{background:#DFE9DC;color:#4F6B4C}
.role{display:inline-block;font-size:26px;background:#F7F1EA;border:2px solid #E5D6C6;border-radius:14px;padding:12px 22px;margin:0 10px 12px 0}
.arrow{font-size:34px;color:#C98A63;margin:22px 0 14px}
.note{font-size:25px;line-height:1.7;color:#6B635C;margin-top:18px}
.foot{font-size:27px;line-height:1.8;margin-top:40px;color:#3E3A36}
</style>
<div class="wrap">
  <h2>自己否定は、消すのではなく<br>当たる面積を減らす</h2>
  <div class="cols">
    <div class="card">
      <span class="badge b1">役割がひとつ</span>
      <h3>全部が直撃する</h3>
      <span class="role">お母さん</span>
      <div class="arrow">▼ うまくいかない日</div>
      <div class="note">私という人間がダメだ、<br>になってしまう</div>
    </div>
    <div class="card">
      <span class="badge b2">役割がふたつ</span>
      <h3>受け流す先ができる</h3>
      <span class="role">お母さん</span><span class="role">週1で働く人</span>
      <div class="arrow">▼ うまくいかない日</div>
      <div class="note">まあ、明日は仕事だし。<br>でも家では通用してるし</div>
    </div>
  </div>
  <div class="foot">目指すのは、自信をつけることではなく、役割を2つにすること。</div>
</div>
