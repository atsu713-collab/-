<link rel="stylesheet" href="_base.css">
<style>
.wrap{height:1010px}
.chart{position:relative;width:1000px;height:600px;margin:6px auto 0;background:#fff;border-radius:26px;box-shadow:0 6px 24px rgba(160,130,105,.13)}
.zone{position:absolute;left:60px;bottom:60px;width:430px;height:270px;background:#EFF5EC;border:3px dashed #9CB89A;border-radius:20px}
.zone span{position:absolute;left:24px;top:20px;font-size:26px;color:#4F6B4C;font-weight:700}
.axis-y{position:absolute;left:24px;top:40px;font-size:24px;color:#8A7F75;writing-mode:vertical-rl}
.axis-x{position:absolute;right:34px;bottom:18px;font-size:24px;color:#8A7F75}
.ylab-top{position:absolute;left:60px;top:26px;font-size:23px;color:#B07A5B}
.ylab-bot{position:absolute;left:60px;bottom:20px;font-size:23px;color:#B07A5B}
.pin{position:absolute;font-size:24px;background:#F7F1EA;border:2px solid #E0CDB8;border-radius:14px;padding:12px 18px}
.pin.good{background:#fff;border-color:#9CB89A}
.foot{font-size:27px;color:#3E3A36;margin-top:34px;line-height:1.8}
</style>
<div class="wrap">
  <h2>怖くない順マップ ─ 最初の1件は、左下から選ぶ</h2>
  <div class="chart">
    <div class="axis-y">断られたときのダメージ</div>
    <div class="ylab-top">大きい ↑</div>
    <div class="ylab-bot">小さい ↓</div>
    <div class="axis-x">準備にかかる時間 →</div>
    <div class="zone"><span>ここから選ぶ</span></div>
    <div class="pin good" style="left:110px;bottom:200px">単発・登録制の仕事</div>
    <div class="pin good" style="left:150px;bottom:110px">週1からのパート</div>
    <div class="pin" style="left:520px;bottom:330px">経験が活きる契約社員</div>
    <div class="pin" style="left:600px;bottom:470px">正社員の事務職</div>
  </div>
  <div class="foot">正社員の事務職は右上。半年後には十分狙えるので、今はそっと置いておきましょう。</div>
</div>
