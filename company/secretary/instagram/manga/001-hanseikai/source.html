<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:#F2EBE3;font-family:'Zen Maru Gothic',sans-serif;
    padding:56px 52px 44px;display:flex;flex-direction:column;position:relative}
  .title{text-align:center;color:#4A4038;font-size:46px;font-weight:700;
    letter-spacing:0.06em;line-height:1.3;flex:none}
  .grid{height:1096px;flex:none;display:grid;grid-template-columns:1fr 1fr;
    grid-template-rows:539px 539px;gap:18px;margin:24px 0 0}
  .panel{min-height:0;overflow:hidden;background:#FBF7F2;border:3px solid #4A4038;border-radius:10px;
    position:relative;display:flex;flex-direction:column;
    align-items:center;padding:16px 16px 20px}
  .num{position:absolute;top:12px;left:15px;color:#B6A695;font-size:25px;font-weight:700}
  .cap{align-self:flex-end;color:#4A4038;font-size:26px;font-weight:500;
    line-height:1.4;min-height:36px}
  .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
  .line{color:#4A4038;font-size:31px;font-weight:700;line-height:1.5;text-align:center}
  .note{color:#6B6058;font-size:24px;font-weight:500;line-height:1.4;
    text-align:center;margin-top:8px}
</style>
<div class="title">夜中の脳内反省会</div>
<div class="grid">

  <div class="panel"><div class="num">1</div>
    <div class="cap">深夜二時。</div>
    <div class="art">
    <svg width="400" height="250" viewBox="0 0 400 250">
      <path d="M18 196 Q18 146 100 143 L300 143 Q382 146 382 196 L382 232 L18 232 Z"
            fill="#E5D9CA" stroke="#4A4038" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="150" cy="106" r="58" fill="#FBF7F2" stroke="#4A4038" stroke-width="6"/>
      <path d="M96 92 Q104 44 150 44 Q196 44 204 92 Q186 66 150 66 Q114 66 96 92 Z" fill="#4A4038"/>
      <circle cx="131" cy="114" r="7" fill="#4A4038"/>
      <circle cx="171" cy="114" r="7" fill="#4A4038"/>
      <path d="M141 138 Q151 145 161 138" stroke="#4A4038" stroke-width="5"
            fill="none" stroke-linecap="round"/>
      <path d="M232 78 L262 60 M238 104 L272 100 M228 130 L258 140"
            stroke="#4A4038" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    </svg></div>
    <div class="line">目が、冴えている。</div>
  </div>

  <div class="panel"><div class="num">2</div>
    <div class="cap">&nbsp;</div>
    <div class="art">
    <svg width="400" height="270" viewBox="0 0 400 270">
      <path d="M42 16 L358 16 Q378 16 378 36 L378 130 Q378 150 358 150 L182 150
               L150 192 L152 150 L42 150 Q22 150 22 130 L22 36 Q22 16 42 16 Z"
            fill="#FBF7F2" stroke="#4A4038" stroke-width="6" stroke-linejoin="round"/>
      <text x="200" y="70" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="34" font-weight="700" fill="#4A4038">では、</text>
      <text x="200" y="120" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="34" font-weight="700" fill="#4A4038">反省会を始めます</text>
      <circle cx="284" cy="212" r="48" fill="#FBF7F2" stroke="#4A4038" stroke-width="6"/>
      <path d="x" fill="none"/>
      <path d="M239 200 Q246 160 284 160 Q322 160 329 200 Q314 178 284 178 Q254 178 239 200 Z" fill="#4A4038"/>
      <circle cx="268" cy="218" r="6" fill="#4A4038"/>
      <circle cx="301" cy="218" r="6" fill="#4A4038"/>
      <path d="M273 240 L296 240" stroke="#4A4038" stroke-width="5" stroke-linecap="round"/>
    </svg></div>
    <div class="line">議長も、自分。</div>
  </div>

  <div class="panel"><div class="num">3</div>
    <div class="cap">議題</div>
    <div class="art">
    <svg width="400" height="230" viewBox="0 0 400 230">
      <rect x="26" y="34" width="348" height="150" rx="10"
            fill="#F2EBE3" stroke="#4A4038" stroke-width="6"/>
      <text x="200" y="92" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="36" font-weight="700" fill="#4A4038">三年前の</text>
      <text x="200" y="146" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="36" font-weight="700" fill="#4A4038">あの発言について</text>
    </svg></div>
    <div class="line">出席者、自分だけ。</div>
  </div>

  <div class="panel"><div class="num">4</div>
    <div class="cap">&nbsp;</div>
    <div class="art">
    <svg width="400" height="250" viewBox="0 0 400 250">
      <circle cx="196" cy="124" r="76" fill="#FBF7F2" stroke="#4A4038" stroke-width="6"/>
      <path d="M124 106 Q134 44 196 44 Q258 44 268 106 Q244 74 196 74 Q148 74 124 106 Z" fill="#4A4038"/>
      <path d="M158 130 L186 130 M206 130 L234 130" stroke="#4A4038"
            stroke-width="7" stroke-linecap="round"/>
      <path d="M176 168 Q196 154 216 168" stroke="#4A4038" stroke-width="6"
            fill="none" stroke-linecap="round"/>
      <path d="M292 86 q13 21 0 30 q-13 -9 0 -30 Z" fill="#8FA6B8"/>
    </svg></div>
    <div class="line">全員一致で、有罪。</div>
    <div class="note">※ この会議に権限はありません</div>
  </div>

</div>
