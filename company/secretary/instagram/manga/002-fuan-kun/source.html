<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:#F2EBE3;font-family:'Zen Maru Gothic',sans-serif;
    padding:56px 52px 44px;display:flex;flex-direction:column}
  .title{text-align:center;color:#4A4038;font-size:46px;font-weight:700;
    letter-spacing:0.06em;line-height:1.3;flex:none}
  .grid{height:1096px;flex:none;display:grid;grid-template-columns:1fr 1fr;
    grid-template-rows:539px 539px;gap:18px;margin:24px 0 0}
  .panel{min-height:0;overflow:hidden;background:#FBF7F2;border:3px solid #4A4038;
    border-radius:10px;position:relative;display:flex;flex-direction:column;
    align-items:center;padding:16px 16px 20px}
  .num{position:absolute;top:12px;left:15px;color:#B6A695;font-size:25px;font-weight:700}
  .cap{align-self:flex-end;color:#4A4038;font-size:26px;font-weight:500;
    line-height:1.4;min-height:36px}
  .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
  .line{color:#4A4038;font-size:29px;font-weight:700;line-height:1.5;text-align:center}
  .note{color:#6B6058;font-size:24px;font-weight:500;line-height:1.4;
    text-align:center;margin-top:8px}
</style>
<div class="title">不安くん、常駐しています</div>
<div class="grid">

  <div class="panel"><div class="num">1</div>
    <div class="cap">ある日の部屋。</div>
    <div class="art">
    <svg width="420" height="260" viewBox="0 0 420 260">
      <!-- 主人公 -->
      <circle cx="118" cy="118" r="52" fill="#FBF7F2" stroke="#4A4038" stroke-width="6"/>

      <circle cx="136" cy="126" r="6" fill="#4A4038"/>

      <path d="M72 172 Q118 156 164 172 L172 232 L64 232 Z" fill="#FBF7F2"
            stroke="#4A4038" stroke-width="6" stroke-linejoin="round"/>
      <!-- 不安くん（黒い人型・正座） -->
      <circle cx="300" cy="128" r="48" fill="#4A4038"/>
      <ellipse cx="286" cy="126" rx="7" ry="9" fill="#FBF7F2"/>
      <ellipse cx="315" cy="126" rx="7" ry="9" fill="#FBF7F2"/>
      <path d="M258 182 Q300 166 342 182 Q356 210 356 232 L244 232 Q244 210 258 182 Z"
            fill="#4A4038"/>
    </svg></div>
    <div class="line">どちらさまですか。</div>
  </div>

  <div class="panel"><div class="num">2</div>
    <div class="cap">&nbsp;</div>
    <div class="art">
    <svg width="420" height="280" viewBox="0 0 420 280">
      <path d="M52 18 L368 18 Q388 18 388 38 L388 104 Q388 124 368 124 L212 124
               L180 164 L182 124 L52 124 Q32 124 32 104 L32 38 Q32 18 52 18 Z"

      <text x="210" y="88" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="42" font-weight="700" fill="#4A4038">不安です</text>
      <circle cx="292" cy="216" r="46" fill="#4A4038"/>
      <ellipse cx="278" cy="214" rx="7" ry="9" fill="#FBF7F2"/>
      <ellipse cx="306" cy="214" rx="7" ry="9" fill="#FBF7F2"/>
      <path d="M252 264 Q292 250 332 264 L340 280 L244 280 Z" fill="#4A4038"/>
    </svg></div>
    <div class="line">名乗られても困る。</div>
  </div>

  <div class="panel"><div class="num">3</div>
    <div class="cap">&nbsp;</div>
    <div class="art">
    <svg width="420" height="270" viewBox="0 0 420 270">
      <!-- 主人公の吹き出し（尻尾は左下＝主人公へ） -->
      <path d="M28 12 L228 12 Q246 12 246 30 L246 92 Q246 110 228 110 L104 110
               L74 142 L80 110 L28 110 Q10 110 10 92 L10 30 Q10 12 28 12 Z"
            fill="#FBF7F2" stroke="#4A4038" stroke-width="5" stroke-linejoin="round"/>
      <text x="128" y="52" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="27" font-weight="700" fill="#4A4038">呼んでないん</text>
      <text x="128" y="90" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="27" font-weight="700" fill="#4A4038">ですけど</text>

      <path d="M212 104 L400 104 Q416 104 416 120 L416 186 Q416 202 400 202 L356 202
               L370 234 L332 202 L212 202 Q196 202 196 186 L196 120 Q196 104 212 104 Z"
            fill="#4A4038"/>
      <text x="306" y="144" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="26" font-weight="700" fill="#FBF7F2">呼ばれてない</text>
      <text x="306" y="180" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="26" font-weight="700" fill="#FBF7F2">ときも来ます</text>
      <!-- 主人公（左下） -->
      <circle cx="66" cy="204" r="38" fill="#FBF7F2" stroke="#4A4038" stroke-width="5"/>
      <path d="M30 192 Q36 168 66 168 Q96 168 102 192 Q88 176 66 176 Q44 176 30 192 Z" fill="#4A4038"/>
      <circle cx="53" cy="208" r="5" fill="#4A4038"/>
      <circle cx="79" cy="208" r="5" fill="#4A4038"/>
      <path d="M58 226 L74 226" stroke="#4A4038" stroke-width="4" stroke-linecap="round"/>
      <!-- 不安くん（右下） -->
      <circle cx="360" cy="242" r="25" fill="#4A4038"/>
      <ellipse cx="352" cy="240" rx="4.5" ry="6" fill="#FBF7F2"/>
      <ellipse cx="369" cy="240" rx="4.5" ry="6" fill="#FBF7F2"/>
      </svg></div>
    <div class="line">通勤してくるな。</div>
  </div>

  <div class="panel"><div class="num">4</div>
    <div class="cap">何の仕事ですか。</div>
    <div class="art">
    <svg width="420" height="250" viewBox="0 0 420 250">
      <path d="M40 16 L380 16 Q400 16 400 36 L400 132 Q400 152 380 152 L322 152
               L312 192 L286 152 L40 152 Q20 152 20 132 L20 36 Q20 16 40 16 Z"
            fill="#4A4038"/>
      <text x="210" y="66" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="32" font-weight="700" fill="#FBF7F2">危険がないか、</text>
      <text x="210" y="112" text-anchor="middle" font-family="Zen Maru Gothic"
            font-size="32" font-weight="700" fill="#FBF7F2">見張る係です</text>
      <circle cx="300" cy="216" r="34" fill="#4A4038"/>
      <ellipse cx="290" cy="214" rx="5.5" ry="7" fill="#FBF7F2"/>
      <ellipse cx="311" cy="214" rx="5.5" ry="7" fill="#FBF7F2"/>
      <circle cx="120" cy="212" r="38" fill="#FBF7F2" stroke="#4A4038" stroke-width="5"/>
      <path d="M84 200 Q90 176 120 176 Q150 176 156 200 Q142 184 120 184 Q98 184 84 200 Z" fill="#4A4038"/>
      <path d="M106 210 L118 210 M124 210 L136 210" stroke="#4A4038" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="121" cy="232" rx="9" ry="6" fill="#4A4038"/>
    </svg></div>
    <div class="line">まじめに働いていた。</div>
    <div class="note">※ ただし、ほぼ誤報です</div>
  </div>

</div>
